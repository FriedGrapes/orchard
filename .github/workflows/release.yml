# 공개 저장소(FriedGrapes/orchard)에서 v* 태그가 올라오면 윈도우·안드로이드를 빌드해 Releases에 올린다.
# 앱들은 이 Releases를 보고 스스로 업데이트한다.
# 빠르게: 릴리스 틀을 먼저 만들고 윈도우(x64·ARM)·안드로이드를 동시에 빌드한다. 시험은 모노레포에서 이미 돈다.
name: release

on:
  push:
    tags: ["v*"]
  # 이미 나온 릴리스에 안드로이드만 다시 빌드해 붙일 때(예: 안드로이드 빌드만 실패했을 때)
  workflow_dispatch:
    inputs:
      tag:
        description: "붙일 릴리스 태그 (예: v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 릴리스 틀 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create "$TAG" --repo ${{ github.repository }} --title "Orchard ${TAG}" --notes "Orchard ${TAG}"

  windows:
    needs: release
    if: github.event_name == 'push'
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: false
      - name: vpk 설치
        run: dotnet tool install -g vpk --version 1.2.161
      - name: 빌드·포장
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RID: ${{ matrix.rid }}
        run: |
          set -e
          V=${TAG#v}
          CH=$([ "$RID" = win-x64 ] && echo win || echo win-arm64)
          ARCH=${RID#win-}
          # .NET 은 통째로 넣지 않고 설치할 때 없으면 받는다(설치 파일 82MB → 약 17MB)
          dotnet publish windows/Orchard.Windows -c Release -r $RID --self-contained false -p:Version=$V -o publish
          vpk download github --repoUrl https://github.com/${{ github.repository }} --channel $CH --token "$GITHUB_TOKEN" -o releases || true
          vpk pack -u Orchard -v $V -p publish -e Orchard.exe --channel $CH --packTitle Orchard -r $RID \
            -f net8.0-$ARCH-desktop --icon windows/Orchard.Windows/Assets/orchard.ico -o releases
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --channel $CH -o releases \
            --publish --merge --releaseName "Orchard v$V" --tag v$V --token "$GITHUB_TOKEN"

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # 기본값('tools')은 없어진 꾸러미라 설치에 실패한다
          packages: "platform-tools"
      # 빌드 재료(Gradle 꾸러미·빌드 캐시)를 다음 배포에 다시 쓴다
      - uses: gradle/actions/setup-gradle@v4
      - name: 서명 키
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 비밀값을 윈도우에서 넣으면 끝에 줄바꿈(CR LF)이 붙을 수 있어 걸러 낸다(키·비밀번호는 영문·숫자뿐)
          printf %s "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > $RUNNER_TEMP/orchard.jks
          PW=$(printf %s "$KEY_PASSWORD" | tr -d '\r\n ')
          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          RELEASE_STORE_FILE=$RUNNER_TEMP/orchard.jks
          RELEASE_STORE_PASSWORD=$PW
          RELEASE_KEY_ALIAS=orchard
          RELEASE_KEY_PASSWORD=$PW
          EOF
          keytool -list -keystore $RUNNER_TEMP/orchard.jks -storepass "$PW" -alias orchard > /dev/null && echo "서명 키 확인됨"
      - name: 빌드
        working-directory: android
        run: bash ./gradlew --build-cache --parallel assembleFossRelease
      - name: 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${TAG#v}
          cp android/app/build/outputs/apk/foss/release/app-foss-release.apk Orchard-android_v$V.apk
          gh release upload "$TAG" "Orchard-android_v$V.apk" --repo ${{ github.repository }} --clobber
